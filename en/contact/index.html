    <h1 style="font-family:'Noto Serif TC',serif;font-size:clamp(2.2rem,5vw,4.5rem);line-height:1.15;margin:.3em 0">Contact ECDECO About Your Home Project</h1>
    <p style="font-size:1.2rem;max-width:760px">Contact ECDECO by email to open a conversation about your Hong Kong home. If drawings or project details are ready, use the project enquiry form to share them.</p>
    <section><h2>A considered way to make contact</h2><p>Whether you are rethinking a new home, undertaking a whole-home renovation, or bringing greater order to daily life through bespoke joinery, ECDECO welcomes an initial email. The most useful place to begin is the home itself: its conditions, the household’s routines, and what you would like to improve.</p><p>This page is for direct correspondence and appointment-led conversations. When your brief, drawings or images are ready, you can “submit your project details”. Before getting in touch, you may also “explore our integrated services”, “see the design and fit-out process”, or “view selected residential projects”.</p></section><section><h2>Context that helps a first exchange</h2><p>A few essentials help make the first exchange more focused: the property district—rather than a full address—approximate size, home type, desired services, anticipated starting window and current budget range. It is also helpful to share how the household lives now and what is not working as well as it should.</p><p>The project enquiry form provides a structured way to share this information, for internal initial understanding. There is no need to resolve every detail before writing; a clear outline of the project is a sound starting point for a more informed conversation.</p></section><section><h2>Drawings and site images are optional</h2><p>A floor plan or a few current site images can give useful context, but they are optional. The project enquiry form accepts PDF, JPG and PNG files, with a 15MB limit for each file and a 30MB total attachment limit.</p><p>There is no need to provide DWG files for a first enquiry. A shareable plan, a handful of images and a short note are enough to add useful context at this stage.</p></section><section><h2>Email, appointments and enquiry data</h2><p>For direct correspondence, email info@ecdeco.com.hk. Meetings or studio arrangements are by appointment, and email is the formal channel for project follow-up; no fixed response time is stated on the site.</p><p>When you use the site or its project form, names, telephone numbers, email addresses, project information, attachments and website analytics data are handled for replying to enquiries, assessing service needs, internal client management and, where consent is given, website analysis. ECDECO does not publish client addresses, private information or floor plans without consent. Please read the “Privacy Policy” for the confirmed data practices.</p></section>
