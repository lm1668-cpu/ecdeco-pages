    <h1 style="font-family:'Noto Serif TC',serif;font-size:clamp(2.2rem,5vw,4.5rem);line-height:1.15;margin:.3em 0">ST. GEORGE’S MANSIONS T3 住宅設計：在開闊尺度中整理日常收藏與休息</h1>
    <p style="font-size:1.2rem;max-width:760px">以石材、木飾面、層次照明與訂製收納，讓相聚、收藏與休息在同一個家中各有位置。</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:24px 0;border-block:1px solid rgba(58,36,30,.18)"><div><span>地區</span><strong>何文田</strong></div><div><span>項目面積</span><strong>約 250 平方米</strong></div><div><span>住宅類型</span><strong>私人住宅</strong></div><div><span>服務範圍</span><strong>住宅項目</strong></div></div>
    <section><h2>設計敘事｜讓開闊公共區回到可親近的日常尺度</h2><p>ST. GEORGE’S MANSIONS T3 位於何文田，面積約 250 平方米。公開影像由餐區與客廳展開：圓形餐桌、吊燈、長窗景、石材地面及家具擺位共同整理公共區的尺度。設計保留空間的開闊感，同時以光線、桌面與座位的關係，讓日常聚會不會顯得疏離。</p><p>當空間由客飯廳延伸至樓梯、衣帽間、睡房及浴室，材料與訂製構件持續建立可辨識的秩序。石材、暖色木飾面、金屬細節與間接照明並非單純裝飾，而是用來調節視線、展示、收納及不同房間的親密程度，讓大尺度住宅仍然貼近日常生活。</p></section><section><h2>客飯廳、樓梯與私密空間｜以動線串連不同生活狀態</h2><p>客廳以石材地面、長窗景、天花燈槽及家具擺位組織主要停留區；餐區則以圓桌與吊燈成為相聚的焦點。兩者保持連續視線，讓用餐、交談與窗邊景觀同時存在。樓梯以石材踏步、玻璃欄杆和下照燈帶勾勒垂直動線，亦把過渡空間處理成完整畫面。</p><p>主人房和睡房以軟包床架、牆面照明、窗邊視野與整合收納回到休息尺度。衣帽間、梳妝及展示區把層架、收納櫃、梳妝檯、石材檯面與燈帶集中處理；睡房的衣櫃、書枱和床邊收納亦被納入同一組訂製配置，讓個人用品有清楚而不凌亂的位置。</p></section><section><h2>材料與訂製｜讓收藏與生活用品各有展示方式</h2><p>石材表面、暖色木飾面、金屬細節與間接照明構成本案完成影像可見的材料主調。公共區以石材與長窗景打開視線，睡房則透過軟包、木材和柔和照明收斂尺度；材質由明亮公共區走向私密位置時逐步轉換，令不同使用場景有清晰而連貫的性格。</p><p>玻璃門酒櫃把木飾面、石材與內置展示燈光整合在收藏位置；梳妝及展示區以層架、石材檯面和燈帶組成日常整理平台。走廊的木飾面、石材踢腳線與掛畫，則說明牆面亦可成為空間節奏的一部分，而非只餘下通道功能。</p></section><section><h2>完成度與細節｜以可見收口維持一體感</h2><p>公共區、樓梯與私密空間的完成度，取決於不同構件交接時的比例控制。石材踏步與玻璃欄杆、牆面與燈槽、酒櫃與展示燈、衣櫃與書枱之間，需要保持對齊、留縫、光線和飾面層次，才能令整個住宅即使包含多個功能場景，仍維持一致秩序。</p><p>本頁僅根據已公開的完成影像及核實項目資料，描述可見的空間、材料、照明與訂製元素。未公開的工程服務範圍、設備性能、結構、機電及施工方法均不作推斷；案例重點在於讓讀者從完成畫面理解設計如何回應大宅中的相聚、收藏、整理與休息。</p></section>
