    <p style="font-size:1.2rem;max-width:760px">在大尺度之中，以比例、展示、照明與收口，保留可以被日常感受的安靜與秩序。</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:24px 0;border-block:1px solid rgba(58,36,30,.18)"><div><span>地區</span><strong>九龍</strong></div><div><span>項目面積</span><strong>約 250 平方米</strong></div><div><span>住宅類型</span><strong>大宅住宅</strong></div><div><span>服務範圍</span><strong>室內設計、工程統籌、訂製傢俬、軟裝配搭</strong></div></div>
    <section><h2>設計敘事｜以大尺度承托親密的日常</h2><p>ST. GEORGE’S MANSIONS T1 是一個約 250 平方米的大宅住宅。設計讓客飯廳、主人房、衣帽間及窗邊書枱各自有清楚用途，同時維持同一種安靜比例感。深色木材、柔霧石材、玻璃與古銅金細節建立層次；燈光為用餐、閱讀、展示與停留區留出適當明暗關係。</p><p>訂製酒櫃、衣帽間、首飾島櫃、窗邊書枱與大面牆身均由整體比例出發。櫃體、五金、玻璃、燈光及飾面交界放在同一套設計邏輯中，讓空間承托招待與收藏，亦保留獨處時所需的親密尺度。</p></section><section><h2>客飯廳、展示與私密層次</h2><p>客飯廳以深色木飾面、石材、玻璃與垂直吊燈建立聚會氛圍。訂製酒櫃將展示、照明及分格納入牆身之中，與餐區、視線及日常使用一併考慮。</p><p>衣帽間以玻璃、金屬與層板照明整理衣物與日常用品；首飾島櫃以抽屜分格、表面材質及展示細節回應個人收藏。主人房、樓梯燈飾與衛浴都沿用足夠的光線、比例和收口，讓公共區走到私密區時仍有一致完成度。</p></section><section><h2>材料與訂製</h2><p>深色木材、柔霧石材、古銅金、玻璃與層次燈光是本案的材料基礎。訂製酒櫃、衣帽間、首飾島櫃、窗邊書枱及展示面延續這種材料關係，讓功能成為空間比例的一部分。</p></section><section><h2>工程亮點</h2><p>工程處理集中在大面積牆身、訂製酒櫃、首飾島櫃、樓梯燈飾及衛浴之間的尺度、對齊、照明與收口。本頁只說明完成照可見的訂製構件及飾面交界，不對酒櫃設備規格、隱藏機電或未公開施工細節作承諾。</p></section>
